# HunyuanImage-3.0-Instruct AR + DiT deploy without Mooncake.
#
# This uses the registered two-stage HunyuanImage3 pipeline, but transfers
# stage-0 AR outputs to stage-1 DiT through shared memory instead of Mooncake
# or Yuanrong connectors.
pipeline: hunyuan_image_3_moe
async_chunk: false
trust_remote_code: true

connectors:
  shared_memory_connector:
    name: SharedMemoryConnector
    extra:
      shm_threshold_bytes: 65536

stages:
  - stage_id: 0
    is_comprehension: true
    final_output: true
    final_output_type: text
    max_num_seqs: 1
    gpu_memory_utilization: 0.8
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    max_num_batched_tokens: 8192
    devices: "0,1,2,3"
    tensor_parallel_size: 4
    mm_encoder_tp_mode: data
    hf_overrides:
      rope_parameters:
        mrope_section: [0, 32, 32]
        rope_type: default
    omni_kv_config:
      need_send_cache: true
    output_connectors:
      to_stage_1: shared_memory_connector
    default_sampling_params:
      temperature: 0.0
      top_p: 1
      top_k: -1
      max_tokens: 8192
      detokenize: true
      skip_special_tokens: false

  - stage_id: 1
    max_num_seqs: 1
    gpu_memory_utilization: 0.65
    enforce_eager: true
    devices: "4,5,6,7"
    distributed_executor_backend: "mp"
    max_num_batched_tokens: 8192
    omni_kv_config:
      need_recv_cache: true
    input_connectors:
      from_stage_0: shared_memory_connector
    parallel_config:
      tensor_parallel_size: 4
      enable_expert_parallel: false
      sequence_parallel_size: 1
      ulysses_degree: 1
    default_sampling_params:
      num_inference_steps: 50
      guidance_scale: 0

edges:
  - from: 0
    to: 1
    window_size: -1
    max_inflight: 1

platforms:
  npu:
    stages:
      - stage_id: 0
        gpu_memory_utilization: 0.8
        devices: "0,1,2,3"
        tensor_parallel_size: 4
        max_num_batched_tokens: 8192
      - stage_id: 1
        gpu_memory_utilization: 0.65
        devices: "4,5,6,7"
        max_num_batched_tokens: 8192
        parallel_config:
          tensor_parallel_size: 4
          enable_expert_parallel: false
          sequence_parallel_size: 1
          ulysses_degree: 1
